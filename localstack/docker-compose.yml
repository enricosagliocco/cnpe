services:
  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack-main
    restart: unless-stopped
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - PERSISTENCE=1
      - DEBUG=0
      - LS_LOG=info
      - SERVICES=s3,sqs,sns,dynamodb,lambda,iam,sts,cloudwatch,logs,apigateway
      - AWS_DEFAULT_REGION=eu-west-1
    volumes:
      - /opt/localstack/data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
