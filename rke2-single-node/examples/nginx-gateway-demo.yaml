apiVersion: v1
kind: Namespace
metadata:
  name: demo

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-page
  namespace: demo
data:
  index.html: |
    <!doctype html>
    <html lang="it">
      <head>
        <meta charset="utf-8">
        <title>Nginx Demo Gateway</title>
      </head>
      <body>
        <h1>Demo RKE2 Gateway API Single Node</h1>
        <p>Questa pagina e servita da nginx tramite Traefik Gateway API su porta 80.</p>
      </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: custom-page
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        ports:
        - containerPort: 80
      volumes:
      - name: custom-page
        configMap:
          name: nginx-custom-page

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: demo
spec:
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web-gw
  namespace: demo
spec:
  gatewayClassName: traefik
  listeners:
  - name: web
    protocol: HTTP
    port: 80
    hostname: nginx.example.local
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-route
  namespace: demo
spec:
  parentRefs:
  - name: web-gw
    namespace: demo
    sectionName: web
  hostnames:
  - nginx.example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nginx
      port: 80
