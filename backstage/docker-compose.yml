version: '3.8'

services:
  backstage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backstage-app
    ports:
      - "3000:3000"  # Frontend
      - "7007:7007"  # Backend
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=info
    volumes:
      - backstage-data:/app/data
    networks:
      - backstage-network
    restart: unless-stopped

  # Optional: PostgreSQL database for Backstage
  postgres:
    image: postgres:15-alpine
    container_name: backstage-postgres
    environment:
      POSTGRES_DB: backstage
      POSTGRES_USER: backstage
      POSTGRES_PASSWORD: backstage_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backstage-network
    restart: unless-stopped

volumes:
  backstage-data:
  postgres-data:

networks:
  backstage-network:
    driver: bridge
