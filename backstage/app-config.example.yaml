# app-config.example.yaml
# Example configuration for Backstage
# Copy this file to app-config.yaml and customize as needed

app:
  title: Backstage
  baseUrl: http://192.168.1.48:3000

backend:
  baseUrl: http://192.168.1.48:7007
  listen:
    port: 7007
    host: 0.0.0.0  # Listen on all interfaces for remote access

frontend:
  baseUrl: http://192.168.1.48:3000

# Database configuration (optional)
database:
  client: sqlite3
  connection: ':memory:'
  # For PostgreSQL, use:
  # client: pg
  # connection:
  #   host: localhost
  #   port: 5432
  #   user: backstage
  #   password: backstage_password
  #   database: backstage

# Organization configuration
organization:
  name: My Organization

# Auth providers (configure as needed)
auth:
  providers:
    guest: {}

# Plugins
plugins:
  - identity
  - catalog
  - scaffolder
  - search
  - techdocs

# Catalog sources
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location]
  locations:
    # Backstage example components
    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all-components.yaml
    # Local catalog
    - type: file
      target: ./examples/entities

# Scaffolder configuration
scaffolder:
  defaultAuthor:
    name: Scaffolder
    email: scaffolder@example.com
  defaultCommitAction: commit

# TechDocs configuration
techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'

# Logging
logger:
  level: info
